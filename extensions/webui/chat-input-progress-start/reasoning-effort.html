<script type="module">
  import { store } from "/plugins/a0_reasoning_effort/webui/reasoning-effort-store.js";
</script>

<div x-data>
<template x-if="$store.reasoningEffort">
  <div class="reasoning-effort-control" x-data="{ showEffortDropdown: false, customEffort: '' }"
       x-move-before=".agent-profile-anchor"
       x-create="$store.reasoningEffort.onMount()"
       x-destroy="$store.reasoningEffort.cleanup()"
       x-init="
         $watch('$store.chats.selected', value => $store.reasoningEffort.refresh(value || ''));
         $watch('$store.modelConfig.switcherEffectivePreset', () => $store.reasoningEffort.refresh($store.chats?.selected || ''));
         $watch('$store.chats.selectedContext?.agent_profile', () => $store.reasoningEffort.refresh($store.chats?.selected || ''));
       "
       @keydown.escape.window="showEffortDropdown = false">
    <template x-if="$store.chats?.selectedContext">
      <div class="model-switcher-anchor" @click.outside="showEffortDropdown = false">
        <button type="button"
                class="btn-icon-action model-switcher-btn"
                :class="{ 'has-override': !!$store.reasoningEffort.selected }"
                :disabled="$store.reasoningEffort.loading || $store.reasoningEffort.saving || $store.chats.selectedContext.running"
                :title="$store.reasoningEffort.title()"
                aria-haspopup="menu"
                :aria-expanded="showEffortDropdown"
                @click="
                  showEffortDropdown = !showEffortDropdown;
                  if (showEffortDropdown) customEffort = $store.reasoningEffort.customValue();
                ">
          <span class="material-symbols-outlined" style="font-size: 16px;">psychology</span>
          <span class="model-switcher-label" x-text="$store.reasoningEffort.buttonLabel()"></span>
          <span class="material-symbols-outlined" style="font-size: 0.7rem;"
                x-text="showEffortDropdown ? 'expand_less' : 'expand_more'"></span>
        </button>

        <div class="model-switcher-dropdown reasoning-effort-dropdown"
             role="menu"
             x-show="showEffortDropdown"
             x-transition.opacity
             style="display: none;">
          <button type="button"
                  class="model-switcher-item reasoning-effort-item"
                  :class="{ 'active': !$store.reasoningEffort.selected }"
                  :disabled="$store.reasoningEffort.saving"
                  @click="$store.reasoningEffort.select('').then(ok => { if (ok) showEffortDropdown = false; })">
            <span x-text="$store.reasoningEffort.defaultLabel()"></span>
            <span class="material-symbols-outlined" x-show="!$store.reasoningEffort.selected" style="font-size: 15px;">check</span>
          </button>

          <div class="model-switcher-divider" x-show="$store.reasoningEffort.options.length"></div>

          <template x-for="option in $store.reasoningEffort.options" :key="option.value">
            <button type="button"
                    class="model-switcher-item reasoning-effort-item"
                    :class="{ 'active': $store.reasoningEffort.selected === option.value }"
                    :disabled="$store.reasoningEffort.saving"
                    @click="$store.reasoningEffort.select(option.value).then(ok => { if (ok) showEffortDropdown = false; })">
              <span x-text="option.label"></span>
              <span class="material-symbols-outlined" x-show="$store.reasoningEffort.selected === option.value" style="font-size: 15px;">check</span>
            </button>
          </template>

          <div class="model-switcher-divider"></div>

          <div class="reasoning-effort-note" x-show="$store.reasoningEffort.support === 'unknown'">
            LiteLLM and the provider have no known values for this model. Enter a custom value if it is supported.
          </div>

          <div class="reasoning-effort-note" x-show="$store.reasoningEffort.support === 'unsupported'">
            The provider reports that this model does not support reasoning effort.
          </div>

          <div class="reasoning-effort-custom"
               x-show="$store.reasoningEffort.support !== 'unsupported'"
               @keydown.enter.prevent="
                 if (customEffort.trim()) {
                   $store.reasoningEffort.select(customEffort, true).then(ok => {
                     if (ok) { customEffort = ''; showEffortDropdown = false; }
                   });
                 }
               ">
            <input type="text"
                   class="reasoning-effort-input"
                   x-model="customEffort"
                   maxlength="64"
                   autocomplete="off"
                   spellcheck="false"
                   aria-label="Custom reasoning effort"
                   placeholder="Custom value">
            <button type="button"
                    class="reasoning-effort-apply"
                    :disabled="$store.reasoningEffort.saving || !customEffort.trim()"
                    @click="$store.reasoningEffort.select(customEffort, true).then(ok => {
                      if (ok) { customEffort = ''; showEffortDropdown = false; }
                    })">
              Apply
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
</div>

<style>
  .reasoning-effort-control {
    display: contents;
  }

  .reasoning-effort-dropdown {
    min-width: 280px;
  }
  .reasoning-effort-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: none;
    background: transparent;
    color: var(--color-text);
    font-family: inherit;
    text-align: left;
  }
  .reasoning-effort-note {
    padding: 6px 10px;
    color: var(--color-text-secondary);
    font-size: 0.72rem;
    line-height: 1.35;
  }
  .reasoning-effort-custom {
    display: flex;
    gap: 6px;
    padding: 6px;
  }
  .reasoning-effort-input {
    min-width: 0;
    flex: 1;
    padding: 6px 8px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: var(--color-background);
    color: var(--color-text);
    font: inherit;
  }
  .reasoning-effort-input:focus {
    border-color: var(--color-primary);
    outline: none;
  }
  .reasoning-effort-apply {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: var(--color-panel);
    color: var(--color-text);
    font: inherit;
    cursor: pointer;
  }
  .reasoning-effort-apply:disabled {
    cursor: default;
    opacity: 0.45;
  }
</style>
